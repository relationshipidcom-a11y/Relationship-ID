<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <defs>
    <linearGradient id="L" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#4285F4"/><stop offset="1" stop-color="#34A853"/></linearGradient>
    <linearGradient id="R" x1="1" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#EA4335"/><stop offset="1" stop-color="#FBBC05"/></linearGradient>
    <linearGradient id="C" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0A0E1E" flood-opacity="0.45"/></filter>
  </defs>
  <g filter="url(#sh)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- partner 1: left lobe down to the point -->
    <path d="M92 58 C 78 34, 32 32, 30 76 C 29 108, 62 134, 100 168" stroke="url(#L)" stroke-width="20"/>
    <!-- partner 2: right lobe down to the point -->
